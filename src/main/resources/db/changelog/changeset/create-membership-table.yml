databaseChangeLog:
  - changeSet:
      id: create-membership
      author: lemongrab32
      changes:
        - createTable:
            tableName: membership
            columns:
              - column:
                  name: id
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: start_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: final_price
                  type: money
                  constraints:
                    nullable: false
              - column:
                  name: client_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: tariff_id
                  type: integer
                  constraints:
                    nullable: false